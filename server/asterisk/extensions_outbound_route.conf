; Ruta saliente OML id=1 "usa" -> trunk telnyx (generador de config roto: se escribe a mano, 2026-09-03)
; ARG2 = orden del patron de discado en la ruta (1 = 10 digitos prepend +1, 2 = 11 digitos prepend +)
[oml-outr-1]
include => oml-outr-1-custom
exten => _XXXXXXXXXX,1,Verbose(2, OUT-R ${DB(OML/OUTR/1/NAME)})
 same => n,Set(OMLOUTRID=1)
 same => n,Gosub(sub-oml-dialout,s,1(1,1))
 same => n,Gosub(sub-oml-hangup,s,1(OUTR-FAIL))
exten => _1XXXXXXXXXX,1,Verbose(2, OUT-R ${DB(OML/OUTR/1/NAME)})
 same => n,Set(OMLOUTRID=1)
 same => n,Gosub(sub-oml-dialout,s,1(1,2))
 same => n,Gosub(sub-oml-hangup,s,1(OUTR-FAIL))
exten => _+1XXXXXXXXXX,1,Verbose(2, OUT-R ${DB(OML/OUTR/1/NAME)})
 same => n,Set(OMLOUTRID=1)
 same => n,Gosub(sub-oml-dialout,s,1(1,2))
 same => n,Gosub(sub-oml-hangup,s,1(OUTR-FAIL))
exten => i,1,Verbose(2, no match any pattern exten)
 same => n,Set(__DIALSTATUS=NONDIALPLAN)
 same => n,ExecIf($["${CUT(OMLCALLSTATUS,-,1)}" == "BTOUT"]?Set(__DIALSTATUS=BTOUT-NONDIALPLAN))
 same => n,ExecIf($["${CUT(OMLCALLSTATUS,-,1)}" == "CTOUT"]?Set(__DIALSTATUS=CTOUT-NONDIALPLAN))
 same => n,Set(SHARED(OMLCALLSTATUS,${OMLMOTHERCHAN})=${DIALSTATUS})
 same => n,Gosub(sub-oml-hangup,s,1(FAIL FAIL FAIL no hay ruta para ${OMLOUTNUM}))

[oml-outr-1-custom]

; Contexto generico [oml-outr]: lo usan "Llamar fuera de campaña" (sin ruta de campaña) y las transferencias externas.
; Formato igual al de otro cliente: exten i + include de la unica ruta (2026-09-03)
[oml-outr]
include => oml-outr-1
exten => i,1,Verbose(2, dont exist pattern)
 same => n,Set(__DIALSTATUS=NONDIALPLAN)
 same => n,ExecIf($["${CUT(OMLCALLSTATUS,-,1)}" == "BTOUT"]?Set(__DIALSTATUS=BTOUT-NONDIALPLAN))
 same => n,ExecIf($["${CUT(OMLCALLSTATUS,-,1)}" == "CTOUT"]?Set(__DIALSTATUS=CTOUT-NONDIALPLAN))
 same => n,Set(SHARED(OMLCALLSTATUS,${OMLMOTHERCHAN})=${DIALSTATUS})
 same => n,Gosub(sub-oml-hangup,s,1(FAIL FAIL FAIL no hay ruta para ${OMLOUTNUM}))
