[from-pstn]
; SIP provider workaround: if the INVITE arrives with a Request-URI that is not
; the DID (sip:user@ or sip:s@), we extract the real DID from the To: header and route it.
exten => s,1,Set(TO_HDR=${PJSIP_HEADER(read,To)})
 same => n,Set(DID=${CUT(TO_HDR,@,1)})
 same => n,Set(DID=${CUT(DID,:,2)})
 same => n,ExecIf($["${DID:0:1}" = "+"]?Set(DID=${DID:1}))
 same => n,GotoIf($["${DID}" = ""]?invalid)
 same => n,Set(__DLRCALLER=${CALLERID(num)})
 same => n,Set(CHANNEL(hangup_handler_push)=dialer-missed,s,1)
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(timeout)=2)
 same => n,Set(DLRINB=${CURL(http://10.22.22.1:8055/inbound_campana?from=${CALLERID(num)})})
 same => n,ExecIf($["${DLRINB}" != ""]?Goto(oml-dial-in,${DLRINB},1))
 same => n,Goto(oml-dial-in,${DID},1)
 same => n(invalid),Playback(pbx-invalid)
 same => n,Hangup()

exten => inbound_did_alias,1,Goto(s,1)

[test-trunk]
; trunk test with a real caller ID: channel originate Local/s@test-trunk application Wait 30
exten => s,1,Set(CALLERID(all)="El Negocio" <+15551000000>)
 same => n,Dial(PJSIP/+15551000001@telnyx,30)
 same => n,Hangup()

; MISSED CALL: when an inbound call that was NOT answered by an agent hangs up
; (status other than CONNECT: it rang and nobody took it, or the customer hung up waiting), the lead enters
; a cola como "Llamada Perdida" (orden 0) via did-picker -> /api/v1/dialer/missed_call/.
[dialer-missed]
exten => s,1,NoOp(missed-check status=${SHARED(OMLCALLSTATUS,${CHANNEL})} caller=${DLRCALLER})
 same => n,ExecIf($["${SHARED(OMLCALLSTATUS,${CHANNEL})}" != "CONNECT" & "${DLRCALLER}" != ""]?Set(DLRMISSED=${CURL(http://10.22.22.1:8055/missed?from=${DLRCALLER})}))
 same => n,Return()

; inbound test with a real caller ID (simulates a customer calling in):
;   channel originate Local/s@test-inbound application Wait 40
[test-inbound]
exten => s,1,Set(CALLERID(all)="Inbound Test" <+15551000002>)
 same => n,Set(__DLRCALLER=+15551000002)
 same => n,Set(CHANNEL(hangup_handler_push)=dialer-missed,s,1)
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(timeout)=2)
 same => n,Set(DLRINB=${CURL(http://10.22.22.1:8055/inbound_campana?from=+15551000002)})
 same => n,ExecIf($["${DLRINB}" != ""]?Goto(oml-dial-in,${DLRINB},1))
 same => n,Goto(oml-dial-in,+15551000003,1)

; SOFTPHONE MASKING: on the leg toward the AGENT (pre-dial handler) the lead's number
; travels masked (From/CallerID and the OMLOUTNUM header) when the contact is identified
; (OMLCODCLI). Llamadas manuales a un numero tecleado o entrantes de desconocidos: numero real.
; The leg toward the provider and the records (call log, recordings) keep the real number.
[mask-agent]
exten => s,1,Set(DLRMASKNUM=${OMLOUTNUM})
 same => n,GotoIf($["${OMLCODCLI}" = "" | "${OMLCODCLI}" = "-1" | "${OMLCODCLI}" = "0"]?fin)
 same => n,GotoIf($[${LEN(${OMLOUTNUM})} < 4]?fin)
 same => n,Set(DLRMASKNUM=XXXXXX${OMLOUTNUM:-4})
 same => n,Set(CALLERID(all)="Lead ***-***-${OMLOUTNUM:-4}" <${DLRMASKNUM}>)
 same => n,Set(CONNECTEDLINE(all)="Lead ***-***-${OMLOUTNUM:-4}" <${DLRMASKNUM}>)
 same => n(fin),Return()

; NUMEROS DE PRUEBA DE LA APP (decisión de producto). Se marcan como cualquier lead:
;   5550000001 = eco (contesta y devuelve tu voz)
;   5550000002 = timbra 12 s y cae a buzon de voz
;   5550000003 = timbra 30 s y nadie contesta
[test-leads]
exten => 5550000001,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()
exten => 5550000002,1,Progress()
 same => n,Playtones(ring)
 same => n,Wait(12)
 same => n,StopPlaytones()
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(vm-theperson&vm-isunavail&vm-intro&beep)
 same => n,Wait(25)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
exten => 5550000003,1,Progress()
 same => n,Playtones(ring)
 same => n,Wait(30)
 same => n,StopPlaytones()
 same => n,Hangup(19)
